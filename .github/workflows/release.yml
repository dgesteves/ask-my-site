name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm provenance and trusted publishing.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      # With pending changesets this opens a "Version Packages" PR; once that PR is merged, it
      # publishes to npm with provenance and creates the GitHub release.
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: 'chore: release'
          pr-title: 'chore: release'
        env:
          # Not needed with npm trusted publishing configured for this repository.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
