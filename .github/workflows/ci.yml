name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Started by the release workflow on its release pull request, which its own pushes can't trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # docusaurus.io's own docs at a pinned commit, which test/corpus.test.ts searches.
      - name: Fetch the real-world docs corpus
        run: node scripts/corpus.mjs
      - run: pnpm test
      - run: pnpm build
      - name: Check the published package (publint, are-the-types-wrong)
        run: pnpm check:package
      - name: Check the script embed's size (the launcher, and the dialog it loads)
        run: node -e "for(const[f,kb]of[['dist/embed.global.js',4],['dist/embed-dialog.global.js',110]]){const s=require('zlib').gzipSync(require('fs').readFileSync(f)).length;console.log(f+':',(s/1024).toFixed(1),'KB gzipped, budget',kb);if(s>kb*1024)throw new Error(f+' is over its '+kb+' KB budget')}"
      - name: The Docusaurus and Starlight docs match the website's
        run: pnpm examples:check
      - name: The Cloudflare Worker template is what ondocs init writes
        run: pnpm template:check
      - name: CLI smoke test, including --check and --llms-txt
        run: |
          node dist/cli.js index examples/nextjs/content/docs --base-url /docs -e mock -o "$RUNNER_TEMP/ask-index.json" --llms-txt "$RUNNER_TEMP/llms"
          node dist/cli.js index examples/nextjs/content/docs --base-url /docs -e mock -o "$RUNNER_TEMP/ask-index.json" --check
          test -s "$RUNNER_TEMP/llms/llms.txt" && test -s "$RUNNER_TEMP/llms/llms-full.txt" && test -s "$RUNNER_TEMP/llms/docs/mcp.md"
      - name: Build the example app (mock mode, no API key)
        run: |
          # Re-link the workspace now that dist/cli.js exists, so the example gets its bin.
          pnpm install --frozen-lockfile --offline
          pnpm --filter ask-my-site-example-nextjs build
      - name: Score the website's retrieval with ondocs eval
        run: node dist/cli.js eval examples/nextjs/ask-eval.yaml
      - name: Lint the example app
        run: pnpm --filter ask-my-site-example-nextjs lint
      - name: Build the Docusaurus example; the plugin must write its index and llms files
        run: |
          pnpm --filter ask-my-site-example-docusaurus build
          node -e "const i=JSON.parse(require('fs').readFileSync('examples/docusaurus/build/ask-index.json','utf8'));if(i.documents.length<5)throw new Error('only '+i.documents.length+' pages indexed');console.log(i.documents.length,'pages,',i.chunks.length,'chunks')"
          test -s examples/docusaurus/build/llms.txt && test -s examples/docusaurus/build/llms-full.txt && test -s examples/docusaurus/build/mcp.md
      - name: Build the Starlight example; the plugin must write its index and llms files, without pagefind:false pages
        run: |
          pnpm --filter ask-my-site-example-starlight build
          node -e "const i=JSON.parse(require('fs').readFileSync('examples/starlight/dist/ask-index.json','utf8'));if(i.documents.length<5)throw new Error('only '+i.documents.length+' pages indexed');if(i.documents.some(d=>d.url.startsWith('/changelog')))throw new Error('indexed the pagefind: false changelog');console.log(i.documents.length,'pages,',i.chunks.length,'chunks')"
          test -s examples/starlight/dist/llms.txt && test -s examples/starlight/dist/llms-full.txt && test -s examples/starlight/dist/integrations/mcp.md && test ! -e examples/starlight/dist/changelog.md

      # Each docs page in headless Chrome: the JavaScript it loads before any interaction, within
      # each site's budget, and the dialog opening from a shortcut pressed while its code loads,
      # with focus in its input and back where it was on close.
      - name: Install headless Chrome
        run: pnpm exec playwright-core install --with-deps --only-shell chromium
      - name: JavaScript per page and the dialog's focus, in a browser
        run: node scripts/js-weight.mjs docusaurus starlight next embed --check

  # A site made the way a new user makes one, with the scaffolder's defaults, and ondocs
  # installed from the packed tarball rather than linked from the workspace. The index is built
  # with OpenAI embeddings from a local stub (scripts/openai-stub.mjs) and must come out embedded.
  # The sites are generated rather than committed: scaffolding takes seconds next to installing,
  # and a committed copy would drift from what create-docusaurus and friends produce today.
  consumers:
    name: Fresh ${{ matrix.site }} site, from the packed package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The last two install the plugin under its own package's name, from packages/.
        site: [next, docusaurus, starlight, docusaurus-plugin-ondocs, starlight-ondocs]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The scaffolders and the sites' dependencies, cached for a week at a time, so the cache
      # follows the templates as they change without saving a new copy on every run.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: consumer-${{ matrix.site }}-${{ steps.week.outputs.week }}
          restore-keys: consumer-${{ matrix.site }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Create, build and check the site
        run: node scripts/consumer-site.mjs ${{ matrix.site }} "$RUNNER_TEMP"/ondocs-*.tgz "$RUNNER_TEMP/site"

  # What `ondocs init` writes for each host, built with that host's own tooling (vercel build,
  # netlify build --offline and serve, wrangler --dry-run and local dev), signed in to nothing, then
  # asked questions against a local OpenAI stub. The astro-* recipes have no route file: the
  # integration serves the endpoints through the adapter. workers-ai runs the Cloudflare Worker
  # template's own tests in workerd, with stand-ins for the site and the AI binding.
  recipes:
    name: Deploy recipe, ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - vercel
          - netlify
          - cloudflare-pages
          - cloudflare-workers
          - github-pages
          - workers-ai
          - astro-node
          - astro-vercel
          - astro-cloudflare
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The host CLIs and the sites' dependencies, cached for a week at a time, as for consumers.
      - id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: recipe-${{ matrix.recipe }}-${{ steps.week.outputs.week }}
          restore-keys: recipe-${{ matrix.recipe }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Write, build and ask the endpoint
        run: node scripts/deploy-recipes.mjs ${{ matrix.recipe }} "$RUNNER_TEMP"/ondocs-*.tgz "$RUNNER_TEMP/site"

  node-compat:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/corpus.mjs
      - run: pnpm test
      - run: pnpm build
