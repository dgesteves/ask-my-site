version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      ai-sdk:
        patterns: ['ai', '@ai-sdk/*']
    ignore:
      # TypeScript 7 is the Go compiler, which typescript-eslint doesn't support yet. Move to it by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
