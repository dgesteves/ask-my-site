name: Bug report
description: Something indexes, answers or renders wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: For a wrong answer or citation, include the question, the answer, and the page it should have cited.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - Docusaurus plugin
        - Starlight plugin
        - Astro integration
        - Script embed
        - React (AskDialog) with the CLI index
        - Handler or library only
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Your plugin options or `ondocs index` command, and the smallest content that shows it (or a link to a repository).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ondocs version
    validations:
      required: true
  - type: input
    id: embedding
    attributes:
      label: The index's embedding model
      description: The `embedding` field at the top of ask-index.json (or "keyword-only").
  - type: input
    id: framework
    attributes:
      label: Framework and version (Docusaurus, Astro, Next.js...)
  - type: input
    id: runtime
    attributes:
      label: Where the handler runs (Vercel, Netlify, Cloudflare, Node...)
